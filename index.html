<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ames Youth Sports Directory - Interactive Trial</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #003366;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        .filter-group label {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        select, input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }
        th {
            background-color: #003366;
            color: white;
            user-select: none;
            position: sticky;
            top: 0;
            transition: background-color 0.2s;
        }
        th:hover {
            background-color: #004080;
        }
        th::after {
            content: ' \21C5';
            font-size: 0.8em;
            opacity: 0.5;
            margin-left: 5px;
        }
        
        /* Active Sorting Header Highlight */
        th.active-sort {
            background-color: #cc0000;
            opacity: 1;
        }
        th.active-sort.asc::after {
            content: ' \25B2';
            opacity: 1;
        }
        th.active-sort.desc::after {
            content: ' \25BC';
            opacity: 1;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
        
        /* Clicked Row Highlight */
        tr.selected-row, tr.selected-row:hover {
            background-color: #fff3cd;
        }

        /* Hyperlink Styling */
        .org-link {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
        }
        .org-link:hover {
            text-decoration: underline;
            color: #003366;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            background: #eee;
            color: #555;
        }
        .unknown {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ames Youth Sports Opportunities</h1>
    
    <div class="controls">
        <div class="filter-group">
            <label for="filterSport">Sport</label>
            <select id="filterSport" onchange="applyFilters()">
                <option value="All">All Sports</option>
                <option value="Aquatics">Aquatics</option>
                <option value="Baseball">Baseball</option>
                <option value="Basketball">Basketball</option>
                <option value="Dance">Dance</option>
                <option value="Football">Football</option>
                <option value="Golf">Golf</option>
                <option value="Gymnastics">Gymnastics</option>
                <option value="Ice Sports">Ice Sports</option>
                <option value="Martial Arts">Martial Arts</option>
                <option value="Multi-Sport">Multi-Sport</option>
                <option value="Soccer">Soccer</option>
                <option value="Softball">Softball</option>
                <option value="Tennis">Tennis</option>
                <option value="Track">Track</option>
                <option value="Volleyball">Volleyball</option>
                <option value="Wrestling">Wrestling</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="filterSeason">Season</label>
            <select id="filterSeason" onchange="applyFilters()">
                <option value="All">All Seasons</option>
                <option value="Spring">Spring</option>
                <option value="Summer">Summer</option>
                <option value="Fall">Fall</option>
                <option value="Winter">Winter</option>
                <option value="Year-Round">Year-Round</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filterType">Org Type</label>
            <select id="filterType" onchange="applyFilters()">
                <option value="All">All Types</option>
                <option value="Municipal">Municipal</option>
                <option value="Non-Municipal">Non-Municipal</option>
            </select>
        </div>
    </div>

    <table id="sportsTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Organization</th>
                <th onclick="sortTable(1)">Sport</th>
                <th onclick="sortTable(2)">Ages/Grades</th>
                <th onclick="sortTable(3)">Season</th>
                <th onclick="sortTable(4)">League Class</th>
                <th onclick="sortTable(5)">Org Type</th>
                <th onclick="sortTable(6)">Profit Status</th>
                <th onclick="sortTable(7)">Scholarships</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>
