<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ames Youth Sports Directory - Interactive Trial</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #003366;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        .filter-group label {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        select, input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }
        th {
            background-color: #003366;
            color: white;
            user-select: none;
            position: sticky;
            top: 0;
            transition: background-color 0.2s;
        }
        th:hover {
            background-color: #004080;
        }
        th::after {
            content: ' \21C5';
            font-size: 0.8em;
            opacity: 0.5;
            margin-left: 5px;
        }
        
        /* Active Sorting Header Highlight */
        th.active-sort {
            background-color: #cc0000;
            opacity: 1;
        }
        th.active-sort.asc::after {
            content: ' \25B2';
            opacity: 1;
        }
        th.active-sort.desc::after {
            content: ' \25BC';
            opacity: 1;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
        
        /* Clicked Row Highlight */
        tr.selected-row, tr.selected-row:hover {
            background-color: #fff3cd;
        }

        /* Hyperlink Styling */
        .org-link {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
        }
        .org-link:hover {
            text-decoration: underline;
            color: #003366;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            background: #eee;
            color: #555;
        }
        .unknown {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ames Youth Sports Opportunities</h1>
    
    <div class="controls">
        <div class="filter-group">
            <label for="filterSport">Sport</label>
            <select id="filterSport" onchange="applyFilters()">
                <option value="All">All Sports</option>
                <option value="Aquatics">Aquatics</option>
                <option value="Baseball">Baseball</option>
                <option value="Basketball">Basketball</option>
                <option value="Dance">Dance</option>
                <option value="Football">Football</option>
                <option value="Gymnastics">Gymnastics</option>
                <option value="Ice Sports">Ice Sports</option>
                <option value="Martial Arts">Martial Arts</option>
                <option value="Multi-Sport">Multi-Sport</option>
                <option value="Soccer">Soccer</option>
                <option value="Softball">Softball</option>
                <option value="Track">Track</option>
                <option value="Volleyball">Volleyball</option>
                <option value="Wrestling">Wrestling</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="filterSeason">Season</label>
            <select id="filterSeason" onchange="applyFilters()">
                <option value="All">All Seasons</option>
                <option value="Spring">Spring</option>
                <option value="Summer">Summer</option>
                <option value="Fall">Fall</option>
                <option value="Winter">Winter</option>
                <option value="Year-Round">Year-Round</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filterType">Org Type</label>
            <select id="filterType" onchange="applyFilters()">
                <option value="All">All Types</option>
                <option value="Municipal">Municipal</option>
                <option value="Non-Municipal">Non-Municipal</option>
            </select>
        </div>
    </div>

    <table id="sportsTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Organization</th>
                <th onclick="sortTable(1)">Sport</th>
                <th onclick="sortTable(2)">Ages/Grades</th>
                <th onclick="sortTable(3)">Season</th>
                <th onclick="sortTable(4)">League Class</th>
                <th onclick="sortTable(5)">Org Type</th>
                <th onclick="sortTable(6)">Profit Status</th>
                <th onclick="sortTable(7)">Scholarships</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    const sportsData = [
        { org: "Ames Youth Baseball (AYB) / Ames Storm", url: "https://amesyouthbaseball.org", sport: "Baseball", ages: "PreK - 6th Grade", season: "Spring / Summer", class: "Rec & Travel", type: "Non-Municipal", profit: "Non-Profit", scholarships: "Unknown" },
        { org: "Ames Girls Softball Association (AGSA) / Ames Thunder", url: "https://amesgirlssoftball.org", sport: "Softball", ages: "PreK - 18U (9U competes in 10U)", season: "Spring / Summer", class: "Rec & Travel", type: "Non-Municipal", profit: "Non-Profit", scholarships: "Unknown" },
        { org: "City of Ames Parks and Rec", url: "https://www.cityofames.org", sport: "Multi-Sport", ages: "Ages 4 - 6th Grade", season: "Varies (All)", class: "Rec", type: "Municipal", profit: "Non-Profit", scholarships: "Unknown" },
        { org: "Ames Soccer Club", url: "https://amessoccer.org", sport: "Soccer", ages: "5U - 19U", season: "Fall & Spring", class: "Rec & Travel", type: "Non-Municipal", profit: "Non-Profit", scholarships: "Unknown" },
        { org: "Two Rivers YMCA", url: "https://tworiversymca.org/youthsports", sport: "Multi-Sport", ages: "Youth", season: "Year-Round", class: "Rec", type: "Non-Municipal", profit: "Non-Profit", scholarships: "Unknown" },
        { org: "Upward Sports @ The PLEX", url: "https://theplex.org/youth-sports", sport: "Basketball", ages: "K - 6th Grade", season: "Winter", class: "Rec", type: "Non-Municipal", profit: "Unknown", scholarships: "Unknown" },
        { org: "Ames Basketball Club", url: "https://www.ameshighhoops.com/aclub", sport: "Basketball", ages: "Youth", season: "Winter", class: "Club / Travel", type: "Non-Municipal", profit: "Unknown", scholarships: "Unknown" },
        { org: "Youth Sports Foundation (YSF)", url: "https://youthsportsfoundation.org", sport: "Football", ages: "3rd - 6th Grade", season: "Fall", class: "Rec", type: "Non-Municipal", profit: "Non-Profit", scholarships: "Unknown" },
        { org: "Ames Youth Football", url: "#", sport: "Football", ages: "Youth", season: "Fall", class: "Flag & Tackle", type: "Non-Municipal", profit: "Unknown", scholarships: "Unknown" },
        { org: "Ames Minor Hockey Association", url: "https://ameshockey.com", sport: "Ice Sports", ages: "8U - High School", season: "Winter", class: "Rec & Travel", type: "Non-Municipal", profit: "Non-Profit", scholarships: "Unknown" },
        { org: "Ames Figure Skating Club", url: "https://amesfsc.org", sport: "Ice Sports", ages: "Ages 3+", season: "Year-Round", class: "Rec", type: "Non-Municipal", profit: "Non-Profit", scholarships: "Unknown" },
        { org: "ISU Recreation Services", url: "https://cyclonehealth.iastate.edu/recreation/youth", sport: "Aquatics", ages: "Youth", season: "Year-Round", class: "Rec", type: "Municipal", profit: "Non-Profit", scholarships: "N/A" },
        { org: "Cyclone Swim School", url: "https://cycloneswimschool.com", sport: "Aquatics", ages: "Ages 4+", season: "Year-Round", class: "Rec & Competitive", type: "Non-Municipal", profit: "Unknown", scholarships: "Unknown" },
        { org: "SUCCESS Gymnastics", url: "https://successgymnastics.net", sport: "Gymnastics", ages: "Toddler+", season: "Year-Round", class: "Rec & Competitive", type: "Non-Municipal", profit: "Unknown", scholarships: "Unknown" },
        { org: "Iowa Flyers Track", url: "https://iowaflyers.com", sport: "Track", ages: "Ages 7+", season: "Spring", class: "Rec", type: "Non-Municipal", profit: "Unknown", scholarships: "Unknown" },
        { org: "AAU Ames Volleyball", url: "https://register.ryzer.com/camp.cfm?sport=8&id=317099", sport: "Volleyball", ages: "Youth", season: "Winter / Spring", class: "Club / Travel", type: "Non-Municipal", profit: "Unknown", scholarships: "Unknown" },
        { org: "Cyclone Youth Wrestling", url: "https://cywrestling.com", sport: "Wrestling", ages: "K - 6th Grade", season: "Winter", class: "Rec", type: "Non-Municipal", profit: "Unknown", scholarships: "Unknown" },
        { org: "Ames Area Wrestling Club", url: "#", sport: "Wrestling", ages: "Youth", season: "Winter", class: "Rec & Competitive", type: "Non-Municipal", profit: "Unknown", scholarships: "Unknown" },
        { org: "Ames ATA Black Belt Academy", url: "https://www.amesata.com", sport: "Martial Arts", ages: "Ages 4+", season: "Year-Round", class: "Rec", type: "Non-Municipal", profit: "For-Profit", scholarships: "Unknown" },
        { org: "Robert Thomas Dancenter", url: "https://rtdance.com", sport: "Dance", ages: "PreK - Adult", season: "Year-Round", class: "Rec & Competitive", type: "Non-Municipal", profit: "For-Profit", scholarships: "Unknown" },
        { org: "Bold Dance By Peach", url: "http://www.bolddancebypeach.com", sport: "Dance", ages: "Youth", season: "Year-Round", class: "Rec & Competitive", type: "Non-Municipal", profit: "For-Profit", scholarships: "Unknown" },
        { org: "Performance Dance Centre", url: "http://www.performancedancecentre.com", sport: "Dance", ages: "Youth", season: "Year-Round", class: "Rec & Competitive", type: "Non-Municipal", profit: "For-Profit", scholarships: "Unknown" }
    ];

    let currentSort = { column: -1, direction: 'asc' };

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        data.forEach(item => {
            const tr = document.createElement('tr');
            
            // Add click event to highlight the row, but ignore clicks on the actual hyperlink
            tr.onclick = function(e) {
                if (e.target.tagName !== 'A') {
                    this.classList.toggle('selected-row');
                }
            };
            
            const columns = ['org', 'sport', 'ages', 'season', 'class', 'type', 'profit', 'scholarships'];
            
            columns.forEach((key, index) => {
                const td = document.createElement('td');
                const val = item[key];

                if (index === 0) {
                    td.innerHTML = `<a href="${item.url}" target="_blank" class="org-link">${val}</a>`;
                } else if (val === 'Unknown' || val === 'N/A') {
                    td.innerHTML = `<span class="unknown">${val}</span>`;
                } else if (val === 'Municipal') {
                    td.innerHTML = `<span class="badge" style="background:#d4edda;color:#155724;">${val}</span>`;
                } else if (val === 'Non-Municipal') {
                    td.innerHTML = `<span class="badge" style="background:#e2e3e5;color:#383d41;">${val}</span>`;
                } else {
                    td.textContent = val;
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function applyFilters() {
        const sportFilter = document.getElementById('filterSport').value;
        const seasonFilter = document.getElementById('filterSeason').value;
        const typeFilter = document.getElementById('filterType').value;

        const filteredData = sportsData.filter(item => {
            const matchSport = sportFilter === 'All' || item.sport.includes(sportFilter);
            const matchSeason = seasonFilter === 'All' || item.season.includes(seasonFilter) || item.season.includes('Varies');
            const matchType = typeFilter === 'All' || item.type === typeFilter;
            return matchSport && matchSeason && matchType;
        });

        currentSort = { column: -1, direction: 'asc' };
        updateHeaderStyles(-1, 'asc');
        renderTable(filteredData);
    }

    function sortTable(columnIndex) {
        const tbody = document.getElementById("tableBody");
        const rows = Array.from(tbody.querySelectorAll("tr"));
        
        const direction = currentSort.column === columnIndex && currentSort.direction === 'asc' ? 'desc' : 'asc';
        currentSort = { column: columnIndex, direction: direction };

        updateHeaderStyles(columnIndex, direction);

        rows.sort((a, b) => {
            const cellA = a.children[columnIndex].textContent.trim();
            const cellB = b.children[columnIndex].textContent.trim();
            
            if (cellA < cellB) return direction === 'asc' ? -1 : 1;
            if (cellA > cellB) return direction === 'asc' ? 1 : -1;
            return 0;
        });

        tbody.innerHTML = '';
        rows.forEach(row => tbody.appendChild(row));
    }

    function updateHeaderStyles(activeIndex, direction) {
        const headers = document.querySelectorAll("th");
        headers.forEach((th, index) => {
            th.classList.remove("active-sort", "asc", "desc");
            if (index === activeIndex) {
                th.classList.add("active-sort");
                th.classList.add(direction);
            }
        });
    }

    // Initial render
    renderTable(sportsData);
</script>

</body>
</html>
